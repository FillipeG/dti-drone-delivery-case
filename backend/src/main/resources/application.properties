spring.application.name=simulador

# Simulacao orientada a eventos.
# Com habilitada=true o relogio anda sozinho a cada tick.
# Por padrao o avanco e manual, via POST /api/simulacao/avancar?minutos=N
simulacao.automatica.habilitada=false
simulacao.automatica.intervalo-ms=1000
simulacao.automatica.minutos-por-tick=1.0
spring.jpa.open-in-view=false